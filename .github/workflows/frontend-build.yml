name: Frontend Vue build

on:
  pull_request:
    branches: [DEV, master, FEAT-78]
  push:
    branches: [DEV, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Testar integração Google
        run: npm run test:google

      - name: Testar Google Agenda
        run: npm run test:calendar

      - name: Testar aceite e privacidade
        run: npm run test:legal

      - name: Testar unificação dos modais de tarefa
        run: npm run test:task-modal

      - name: Validar build de produção
        run: npm run build

      - name: Testar servidor de produção Dokku
        run: npm run test:server

      - name: Validar fotos de perfil e contraste dos ícones
        run: node --test tests/profile-photo-colors.test.mjs
